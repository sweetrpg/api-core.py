name: CI

concurrency: python-ci

on:
    push:
        branches: [develop]
        paths:
            - "src/**"
            - "tests/**"
            - setup.cfg
            - setup.py
            - tox.ini
            - "requirements/*.txt"
            - "docs/**"
            - ".github/workflows/**"
    workflow_run:
        workflows: ["Update Requirements"]
        types: [completed]
    workflow_dispatch:

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        concurrency: ci-${{ github.ref }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux
                      os: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Get language version
              id: get_lang_version
              run: |
                    v=$(cat .python-version)
                    echo "lang_version=$v" >> $GITHUB_OUTPUT
                    t=$(cat .tox-env)
                    echo "tox_env=$t" >> $GITHUB_OUTPUT
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ steps.get_lang_version.outputs.lang_version }}
            - name: update-pip
              run: |
                    pip install -U wheel
                    pip install -U setuptools
                    python -m pip install -U pip
            - name: get-pip-cache-dir
              id: pip-cache
              run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
            - name: cache-pip
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pip-cache.outputs.dir }}
                  key: pip|${{ runner.os }}|${{ steps.get_lang_version.outputs.lang_version }}|${{ hashFiles('setup.py') }}|${{ hashFiles('requirements/*.txt') }}
            - name: install-utils
              run: pip install tox
            - name: setup-env
              env:
                  MONGODB_URI: "mongodb://localhost:27017/unit-tests"
              run: |
                    printenv > tests/.env
            - name: start-mongodb
              uses: supercharge/mongodb-github-action@1.6.0
              with:
                  mongodb-version: "7.0"
            - name: tests
              run: |
                    tox -e ${{ steps.get_lang_version.outputs.tox_env }}
            - name: coverage-summary
              run: |
                    echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
                    echo '```' >> "$GITHUB_STEP_SUMMARY"
                    tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage report -m >> "$GITHUB_STEP_SUMMARY"
                    echo '```' >> "$GITHUB_STEP_SUMMARY"
                    mkdir -p coverage-pages
                    tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage xml -o coverage-pages/coverage.xml
                    tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage html -d coverage-pages/htmlcov
            - name: upload-coverage-artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report-${{ matrix.name }}
                  path: coverage-pages/
            # Warn-only: continue-on-error means this never blocks the job, only shows
            # as a flagged step.
            - name: coverage-threshold
              continue-on-error: true
              run: tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage report --fail-under=0
            # Written alongside the HTML/XML report so the publish step below carries it
            # to GitHub Pages - avoids committing to the source branch.
            - name: coverage-badge
              continue-on-error: true
              run: |
                    PCT=$(tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage report --format=total | grep -E '^[0-9]+$' | tail -1)
                    COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
                    printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                        "$PCT" "$COLOR" > coverage-pages/coverage-badge.json
            # keep_files: true - a root-level publish (no destination_dir) otherwise wipes
            # the whole branch by default, which would delete the docs job's /python/
            # subfolder from a previous run.
            - name: publish-coverage
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./coverage-pages
                  keep_files: true

    docs:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: docs
        steps:
            - uses: actions/checkout@v4
            - name: Get language version
              id: get_lang_version
              run: |
                    v=$(cat .python-version)
                    echo "lang_version=$v" >> $GITHUB_OUTPUT
                    t=$(cat .tox-env)
                    echo "tox_env=$t" >> $GITHUB_OUTPUT
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ steps.get_lang_version.outputs.lang_version }}
            - name: install-deps
              run: pip install -r requirements/docs.txt
            - name: make-docs
              run: cd docs && make html
            - name: publish-docs
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs/_build/html
                  destination_dir: python

    publish:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: publish
        permissions:
            id-token: write
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0
            # - name: Build a binary wheel and a source tarball
            #   run: |
            #         python3 -m pip install build --user
            #         python3 -m build
            # - name: Store the distribution packages
            #   uses: actions/upload-artifact@v4
            #   with:
            #     name: python-package-distributions
            #     path: dist/
            # - name: publish
            #   uses: pypa/gh-action-pypi-publish@release/v1
            - name: publish
              uses: relekang/python-semantic-release@v7.34.6
              with:
                additional_options: "--patch"
                github_token: ${{ secrets.GITHUB_TOKEN }}
                repository_username: __token__
                repository_password: ${{ secrets.PYPI_TOKEN }}

    notify:
        needs: [publish]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - repo: api-core.py
                    - repo: catalog-api
                    - repo: catalog-data.py
                    - repo: catalog-data-processor
                    - repo: catalog-objects.py
                    - repo: catalog-web
                    - repo: client.py
                    - repo: data-api
                    - repo: data-objects.py
                    - repo: db.py
                    - repo: initiative-api
                    - repo: initiative-data.py
                    - repo: initiative-objects.py
                    - repo: initiative-web
                    - repo: kv-api
                    - repo: kv-data.py
                    - repo: kv-expression-processor
                    - repo: kv-key-processor
                    - repo: kv-objects.py
                    - repo: kv-value-calculator
                    - repo: kv-web
                    - repo: library-api
                    - repo: library-data.py
                    - repo: library-objects.py
                    - repo: library-web
                    - repo: main-web
                    - repo: model-core.py
                    - repo: shared-web
                    - repo: web-core.py
        steps:
            - uses: juztcode/repo-ditpatch-action@v1
              continue-on-error: true
              with:
                event-type: api-core-published
                token: ${{ secrets.REPO_ACCESS_TOKEN }}
                repository: sweetrpg/${{ matrix.repo }}
